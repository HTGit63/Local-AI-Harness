services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      HARNESS_WORKSPACE_ROOT: /workspace
      HARNESS_WORKSPACE_SEARCH_ROOTS: /host-projects
      HARNESS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      HARNESS_RUNTIME_PROVIDER: ${DOCKER_HARNESS_RUNTIME_PROVIDER:-llamacpp}
      HARNESS_PRIMARY_RUNTIME: ${DOCKER_HARNESS_PRIMARY_RUNTIME:-llamacpp}
      HARNESS_FALLBACK_RUNTIME: ${DOCKER_HARNESS_FALLBACK_RUNTIME:-ollama-legacy}
      LLAMACPP_BASE_URL: ${DOCKER_HARNESS_LLAMACPP_BASE_URL:-http://host.docker.internal:8080/v1}
      LLAMACPP_MODEL_PATH: ${DOCKER_HARNESS_LLAMACPP_MODEL_PATH:-}
      LLAMACPP_MODEL_ALIAS: ${DOCKER_HARNESS_LLAMACPP_MODEL_ALIAS:-gemma4:e4b}
      OLLAMA_BASE_URL: ${DOCKER_HARNESS_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${DOCKER_HARNESS_OLLAMA_MODEL:-gemma4:e4b}
      OPENAI_BASE_URL: ${DOCKER_HARNESS_MODEL_BASE_URL:-http://host.docker.internal:8080/v1}
      OPENAI_API_KEY: ${DOCKER_HARNESS_MODEL_API_KEY:-no-key}
      HARNESS_MODEL: ${DOCKER_HARNESS_MODEL:-gemma4:e4b}
      HARNESS_LOCAL_MODEL_BUDGET_PROFILE: ${HARNESS_LOCAL_MODEL_BUDGET_PROFILE:-lean}
      HARNESS_CONTEXT_BUDGET: ${HARNESS_CONTEXT_BUDGET:-8000}
      HARNESS_STREAM_IDLE_TIMEOUT_MS: ${HARNESS_STREAM_IDLE_TIMEOUT_MS:-120000}
    volumes:
      - ${HARNESS_WORKSPACE_SOURCE:-.}:/workspace
      - ${HARNESS_WORKSPACE_SEARCH_SOURCE:-..}:/host-projects

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"
